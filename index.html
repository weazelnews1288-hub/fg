<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Редактор сайта</title>
  
  <!-- Подключение шрифтов Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Lora:wght@400;500;600&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">

  <style>
    /* ==========================================================================
       1. ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ И СТИЛИ (Изменение цветов, шрифтов и скруглений)
       ========================================================================== */
    :root {
      --bg: #fafaf9;            /* Основной фон страницы */
      --surface: #ffffff;       /* Фон карточек и панелей */
      --fg: #16161a;            /* Цвет основного текста */
      --muted: #6a6a75;         /* Цвет второстепенного текста */
      --line: #e6e6ea;          /* Цвет границ и разделителей */
      --seg: #ececef;           /* Фон переключателей */
      --danger: #d92d20;        /* Цвет предупреждений/удаления */
      --primary: #4f46e5;       /* Главный акцентный цвет сайта */
      --on-primary: #ffffff;    /* Цвет текста на акцентном фоне */
      --font-body: 'Onest', system-ui, -apple-system, sans-serif; /* Основной шрифт */
      --font-head: var(--font-body); /* Шрифт заголовков */
      --head-ls: -.03em;
      --head-scale: 1;
      --font-mono: 'JetBrains Mono', monospace;
      --radius: 14px;           /* Скругление углов элементов */
    }
    
    :root, .scope {
      --primary-text: var(--primary);
      --primary-soft: color-mix(in srgb, var(--primary) 9%, var(--bg));
    }

    /* Настройки для тёмной темы */
    :root[data-theme="dark"] {
      --bg: #0e0e11; 
      --surface: #17171b; 
      --fg: #f2f2f4; 
      --muted: #9b9ba7; 
      --line: #27272d; 
      --seg: #212127; 
      --danger: #f97066;
      color-scheme: dark;
    }
    :root[data-theme="dark"], :root[data-theme="dark"] .scope {
      --primary-text: color-mix(in srgb, var(--primary) 62%, #ffffff);
      --primary-soft: color-mix(in srgb, var(--primary) 16%, var(--bg));
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--fg);
      font-family: var(--font-body); font-size: 16px; line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      transition: background-color .25s, color .25s;
    }

    .muted { color: var(--muted); }
    .label { font-family: var(--font-mono); font-size: .6875rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

    /* ==========================================================================
       2. СТИЛИ ПАНЕЛИ РЕДАКТИРОВАНИЯ И ИНСТРУМЕНТОВ
       ========================================================================== */
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px 20px; }
    
    /* Кнопка-образец цвета */
    .swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--surface); cursor: pointer; padding: 0; box-shadow: 0 0 0 1px var(--line); }
    .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--fg); }
    
    /* Инпут выбора цвета (Color Picker) */
    input[type="color"] { width: 38px; height: 30px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
    
    .field {
      font: inherit; font-size: .875rem; padding: 8px 10px; width: 100%;
      border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg);
    }
    .hex { width: 98px; font-family: var(--font-mono); }
    textarea.field { min-height: 84px; resize: vertical; font-family: var(--font-mono); font-size: .75rem; }
    
    .tool-btn {
      font: inherit; font-size: .875rem; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
      padding: 8px 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
      transition: border-color .15s, background-color .15s;
    }
    .tool-btn:hover:not(:disabled) { border-color: var(--muted); }
    .tool-btn:disabled { opacity: .4; cursor: default; }
    .tool-btn.solid { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
    .tool-btn.danger[data-armed="true"] { color: var(--danger); border-color: var(--danger); }
    
    .seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--seg); border-radius: 10px; max-width: 100%; }
    .seg button {
      font: inherit; font-size: .875rem; line-height: 1.2; padding: 7px 12px; border: 0; border-radius: 8px;
      background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    .seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgb(0 0 0 / .1); }
    .seg.sm button { padding: 5px 10px; font-size: .8125rem; }

    .chip {
      font: inherit; font-size: .875rem; padding: 7px 14px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--line); background: var(--surface); color: var(--fg);
    }
    .chip[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-text); }
    .check { display: inline-flex; align-items: center; gap: 8px; font-size: .875rem; cursor: pointer; }
    .check input { width: 16px; height: 16px; accent-color: var(--primary); }
    .hint { font-size: .8125rem; color: var(--muted); }
    kbd { font-family: var(--font-mono); font-size: .75rem; padding: 1px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); }
    
    .meter { height: 6px; border-radius: 99px; background: var(--seg); overflow: hidden; }
    .meter i { display: block; height: 100%; background: var(--primary); }
    .meter[data-warn="true"] i { background: var(--danger); }
    
    .icon-btn {
      min-width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; padding: 0;
      border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer;
      font: inherit; font-size: .8125rem;
    }
    .icon-btn:hover:not(:disabled) { color: var(--fg); border-color: var(--muted); }
    .icon-btn:disabled { opacity: .35; cursor: default; }
    .icon-btn.danger[data-armed="true"] { padding: 0 10px; color: var(--danger); border-color: var(--danger); }
    .tools { display: inline-flex; gap: 6px; flex: none; }
    
    .mini {
      font: inherit; font-size: .75rem; padding: 5px 9px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--surface); color: var(--fg); cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
      box-shadow: 0 1px 3px rgb(0 0 0 / .15);
    }

    /* Рамки блоков в режиме редактирования */
    .frame { position: relative; border: 1px dashed var(--line); border-radius: calc(var(--radius) + 6px); padding: 10px; margin-block: 12px; min-width: 0; }
    .frame:hover { border-color: color-mix(in srgb, var(--primary) 45%, var(--line)); }
    .frame-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 2px 10px; }
    .settings { display: flex; flex-wrap: wrap; gap: 14px 22px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
    .choice { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .choice.grow { flex: 1 1 280px; }
    .addpick { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); }
    .addpick button {
      font: inherit; text-align: left; padding: 12px 14px; border-radius: 12px; cursor: pointer;
      border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: flex; flex-direction: column; gap: 2px;
      transition: border-color .15s, background-color .15s;
    }
    .addpick button:hover { border-color: var(--primary); background: var(--primary-soft); }
    .addpick small { color: var(--muted); font-size: .75rem; line-height: 1.35; }

    /* ==========================================================================
       3. СТИЛИ БЛОКОВ И КОНТЕНТА САЙТА
       ========================================================================== */
    .brand { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-head); font-weight: 650; font-size: 1.125rem; letter-spacing: var(--head-ls); }
    .mark { width: 16px; height: 16px; border-radius: calc(var(--radius) * .35); background: var(--primary); display: inline-block; flex: none; }
    .logo { height: 26px; width: auto; max-width: 140px; object-fit: contain; flex: none; }
    .navlink {
      font: inherit; font-size: .9375rem; color: var(--muted); background: none; border: 0; padding: 4px 0; cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .navlink:hover { color: var(--fg); }
    .navlink[aria-current="page"] { color: var(--fg); border-bottom-color: var(--primary); }
    .rule { border-top: 1px solid var(--line); }

    .blk { display: flex; flex-direction: column; gap: 28px; padding-block: clamp(28px, 5vw, 56px); min-width: 0; }
    .hero-blk { padding-block: clamp(32px, 7vw, 88px); }
    .blk.bg-soft, .blk.bg-accent { padding-inline: clamp(20px, 4vw, 40px); border-radius: calc(var(--radius) * 1.6); margin-block: 8px; }
    .bg-soft { background: var(--primary-soft); }
    .bg-accent { background: var(--primary); color: var(--on-primary); }
    .bg-accent .lead, .bg-accent .hero-text, .bg-accent .muted, .bg-accent .cap { color: color-mix(in srgb, var(--on-primary) 82%, transparent); }
    .bg-accent .btn { background: var(--on-primary); color: var(--primary); }

    .align-center .head { margin-inline: auto; text-align: center; }
    .align-center .btn { align-self: center; }

    .head { display: flex; flex-direction: column; gap: 12px; max-width: 42rem; min-width: 0; }
    .eyebrow { font-family: var(--font-mono); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--primary-text); }
    .hero-title { font-family: var(--font-head); font-size: calc(clamp(2.1rem, 5.2vw, 3.6rem) * var(--head-scale)); line-height: 1.1; font-weight: 600; letter-spacing: var(--head-ls); text-wrap: balance; }
    .hero-text { font-size: 1.125rem; color: var(--muted); max-width: 52ch; }
    .h2 { font-family: var(--font-head); font-size: calc(clamp(1.5rem, 3vw, 2rem) * var(--head-scale)); line-height: 1.2; font-weight: 600; letter-spacing: var(--head-ls); }
    .lead { color: var(--muted); max-width: 56ch; }
    .prose { max-width: 68ch; font-size: 1.0625rem; }
    .ml { white-space: pre-wrap; }
    .btn {
      font: inherit; font-weight: 500; border: 0; cursor: pointer; display: inline-flex; align-items: center; align-self: flex-start;
      padding: 12px 22px; border-radius: calc(var(--radius) * .75); background: var(--primary); color: var(--on-primary);
      text-decoration: none;
    }

    /* Изображения и карточки */
    .photo { position: relative; border-radius: var(--radius); overflow: hidden; background: var(--primary-soft); min-width: 0; width: 100%; }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--primary-text); font-size: .875rem; padding: 12px; }
    .photo-tools { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; }

    .grid-n { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
    @media (min-width: 640px) { .grid-n.c2, .grid-n.c3, .grid-n.c4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (min-width: 960px) { .grid-n.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .grid-n.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

    .card { background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .pill { display: inline-block; font-family: var(--font-mono); font-size: .6875rem; padding: 3px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary-text); }
    
    .add-tile {
      font: inherit; min-height: 120px; border: 1.5px dashed var(--line); border-radius: var(--radius);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      background: transparent; color: var(--muted); cursor: pointer;
    }
    .add-tile:hover { border-color: var(--primary); color: var(--primary-text); background: var(--primary-soft); }

    /* Редактирование текста прямо на месте (ContentEditable) */
    .editable { outline: 1.5px dashed transparent; outline-offset: 4px; border-radius: 6px; cursor: text; min-width: 2ch; transition: outline-color .15s; }
    .editable:hover { outline-color: color-mix(in srgb, var(--primary) 55%, transparent); }
    .editable:focus { outline: 2px solid var(--primary); outline-offset: 4px; background: var(--primary-soft); }
    .editable:empty::before { content: attr(data-placeholder); color: var(--muted); opacity: .7; }

    .toast {
      position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: .875rem;
    }
  </style>

  <!-- Скрипты библиотек React и Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
</head>
<body>

<div id="root"></div>

<!-- ==========================================================================
     4. ИНИЦИАЛИЗАЦИЯ И НАСТРОЙКИ ТЕМЫ / ЦВЕТА ДО ОТРИСОВКИ
     ========================================================================== -->
<script>
(function () {
  var HEX = /^#[0-9a-f]{6}$/i;
  var SANS = "system-ui,-apple-system,'Segoe UI',sans-serif";
  
  /* Поддерживаемые стили шрифтов */
  var FONTS = {
    modern:   { label: 'Современный', body: "'Onest'," + SANS, head: "'Onest'," + SANS, ls: '-.03em', scale: 1 },
    strict:   { label: 'Строгий', body: "'Manrope'," + SANS, head: "'Manrope'," + SANS, ls: '-.03em', scale: 1 },
    magazine: { label: 'Журнал', body: "'Onest'," + SANS, head: "'Playfair Display',Georgia,serif", ls: '-.01em', scale: 1.05 },
    classic:  { label: 'Классика', body: "'Lora',Georgia,serif", head: "'Lora',Georgia,serif", ls: '-.01em', scale: 1 },
    bold:     { label: 'Выразительный', body: "'Onest'," + SANS, head: "'Unbounded','Onest'," + SANS, ls: '-.02em', scale: .78 }
  };

  /* Вычисление цвета текста поверх акцентного (белый или темный) */
  function onColor(h) {
    var n = parseInt(h.slice(1), 16);
    var L = 0.2126 * ((n >> 16) & 255) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255);
    return L > 128 ? '#111114' : '#ffffff';
  }

  /* Применение стилей оформлений на страницу */
  window.siteTheme = {
    fonts: FONTS,
    on: onColor,
    apply: function (cfg) {
      cfg = cfg || {};
      var r = document.documentElement, f = FONTS[cfg.font] || FONTS.modern;
      var hex = HEX.test(cfg.primary || '') ? cfg.primary : '#4f46e5';
      var rad = [0, 8, 14, 24].indexOf(cfg.radius) >= 0 ? cfg.radius : 14;
      
      r.setAttribute('data-theme', cfg.theme === 'dark' ? 'dark' : 'light');
      r.style.setProperty('--primary', hex);
      r.style.setProperty('--on-primary', onColor(hex));
      r.style.setProperty('--font-body', f.body);
      r.style.setProperty('--font-head', f.head);
      r.style.setProperty('--radius', rad + 'px');
    }
  };

  try {
    window.siteTheme.apply(JSON.parse(localStorage.getItem('site-config-v2') || 'null'));
  } catch (e) {
    window.siteTheme.apply(null);
  }
})();
</script>

<!-- ==========================================================================
     5. ПРИЛОЖЕНИЕ REACT (ОСНОВНАЯ ЛОГИКА И ИНТЕРФЕЙС)
     ========================================================================== -->
<script type="text/babel" data-presets="react">
const { useState, useEffect, useLayoutEffect, useRef, useContext } = React;

const KEY = 'site-config-v2';
const HEX = /^#[0-9a-f]{6}$/i;
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
const mk = (o) => ({ id: uid(), ...o });

/* ---------- Типы доступных блоков для добавления ---------- */
const TYPES = {
  hero:    { name: 'Главный экран',     hint: 'Заголовок, текст, кнопка и фото' },
  text:    { name: 'Текст',             hint: 'Заголовок и текстовые абзацы' },
  cards:   { name: 'Карточки',          hint: 'Сетка из карточек с фото и текстом' },
  image:   { name: 'Фото',              hint: 'Одиночное фото с подписью' },
  split:   { name: 'Фото и текст',      hint: 'Картинка сбоку от текста' },
  gallery: { name: 'Галерея',           hint: 'Набор фотографий' },
  stats:   { name: 'Цифры',             hint: 'Карточки с ключевыми цифрами' },
  faq:     { name: 'Вопросы и ответы',  hint: 'Раскрывающийся список FAQ' },
  cta:     { name: 'Призыв к действию', hint: 'Акцентный блок с кнопкой' },
};

/* Настройки содержимого по умолчанию для каждого блока */
const NEW = {
  hero: () => ({ eyebrow: 'ПОДСКАЗКА: Кликните, чтобы изменить надзаголовок', title: 'Главный заголовок страницы', text: 'Нажмите на любой текст, чтобы сразу отредактировать его прямо на странице.', btn: { label: 'Кнопка действия', link: '' }, image: null }),
  text: () => ({ title: 'Заголовок текстового блока', text: 'Кликните сюда для ввода текста. Используйте Enter для перевода строки.' }),
  cards: () => ({ title: 'Блок с карточками', lead: 'Нажмите на любую карточку для изменения содержимого.', cols: 3, items: [
    mk({ tag: 'Метка 1', title: 'Карточка 1', text: 'Описание карточки. Текст можно редактировать.', image: null }),
    mk({ tag: 'Метка 2', title: 'Карточка 2', text: 'Нажмите на кнопку ниже, чтобы загрузить фото.', image: null })
  ] }),
  image: () => ({ src: null, caption: 'Подпись к фотографии (нажмите для редактирования)', width: 'wide', ratio: '16/9' }),
  split: () => ({ title: 'Фото с описанием', text: 'Здесь вы можете подробно рассказать о продукте или услуге.', image: null, side: 'right' }),
  gallery: () => ({ title: 'Фотогалерея', lead: 'Загружайте сюда несколько снимков.', cols: 3, items: [] }),
  stats: () => ({ title: 'Достижения', lead: '', cols: 3, items: [
    mk({ value: '100+', label: 'довольных клиентов' }), mk({ value: '24/7', label: 'поддержка' }) ] }),
  faq: () => ({ title: 'Часто задаваемые вопросы', items: [
    mk({ q: 'Как изменить этот текст?', a: 'Просто нажмите мышкой на текст и начните вводить свой!' }) ] }),
  cta: () => ({ title: 'Заголовок призыва к действию', text: 'Нажмите, чтобы отредактировать призыв.', btn: { label: 'Связаться', link: '' } }),
};

function newBlock(type) {
  return { id: uid(), type, bg: type === 'cta' ? 'accent' : 'none', align: type === 'cta' ? 'center' : 'left', ...NEW[type]() };
}

/* ---------- Конфигурация сайта по умолчанию ---------- */
function makeDefault() {
  const hero = newBlock('hero');
  const text = newBlock('text');
  return {
    v: 2, theme: 'light', primary: '#4f46e5', font: 'modern', radius: 14,
    brand: 'Мой Сайт', logo: null, contact: 'info@example.com', footer: '© 2026 Все права защищены.',
    pages: [
      { id: 'home', title: 'Главная', nav: true, accent: null, blocks: [hero, text] },
    ],
  };
}

/* ==========================================================================
   6. ОБРАБОТКА И СЖАТИЕ ФОТОГРАФИЙ (Загрузка изображений)
   ========================================================================== */
async function fileToDataUrl(file, { max = 1200, type = 'image/jpeg', q = 0.75 } = {}) {
  const src = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
  
  /* Автоматическое уменьшение и сжатие тяжелых картинок перед сохранением */
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  const w = img.naturalWidth, h = img.naturalHeight;
  const k = Math.min(1, max / Math.max(w, h));
  
  const c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  const ctx = c.getContext('2d');
  if (type === 'image/jpeg') { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height); }
  ctx.drawImage(img, 0, 0, c.width, c.height);
  
  return c.toDataURL(type, q);
}

/* Context приложения */
const Ctx = React.createContext(null);
const useCtx = () => useContext(Ctx);

/* ==========================================================================
   7. РЕДАКТИРУЕМЫЙ ТЕКСТ (Инструмент инлайн-редактирования)
   ========================================================================== */
function Editable({ value, onChange, as: Tag = 'span', className = '', placeholder = 'Нажмите для ввода текста...', multiline = false }) {
  const ref = useRef(null);

  useLayoutEffect(() => {
    const el = ref.current;
    if (el && el.textContent !== value && document.activeElement !== el) {
      el.textContent = value;
    }
  }, [value]);

  const commit = (el) => {
    let t = el.innerText.replace(/\r/g, '');
    t = multiline ? t.trim() : t.replace(/\s+/g, ' ').trim();
    onChange(t);
  };

  return (
    <Tag
      ref={ref}
      className={className + ' editable' + (multiline ? ' ml' : '')}
      contentEditable
      suppressContentEditableWarning
      spellCheck={false}
      data-placeholder={placeholder}
      onBlur={(e) => commit(e.currentTarget)}
      onKeyDown={(e) => {
        if (e.key === 'Escape') { e.currentTarget.textContent = value; e.currentTarget.blur(); }
        if (e.key === 'Enter' && !multiline) { e.preventDefault(); e.currentTarget.blur(); }
      }}
    />
  );
}

/* ==========================================================================
   8. КОМПОНЕНТ ЗАГРУЗКИ И ИЗМЕНЕНИЯ ФОТОГРАФИЙ
   ========================================================================== */
function PickButton({ onPick, children, className = 'mini' }) {
  const ref = useRef(null);
  
  /* Обработчик выбора файла с компьютера */
  const onChange = async (e) => {
    const file = e.target.files[0];
    if (file) {
      const url = await fileToDataUrl(file);
      onPick(url);
    }
    e.target.value = '';
  };

  return (
    <>
      <input ref={ref} type="file" accept="image/*" hidden onChange={onChange} />
      <button type="button" className={className} onClick={() => ref.current && ref.current.click()}>
        {children}
      </button>
    </>
  );
}

function Photo({ src, onChange, ratio = '16/9' }) {
  return (
    <div className="photo" style={{ aspectRatio: ratio }}>
      {src ? (
        <img src={src} alt="Изображение" />
      ) : (
        <div className="photo-empty">
          <span>📷 Выберите фото</span>
        </div>
      )}
      <div className="photo-tools">
        {/* Подсказка/Кнопка загрузки и смены фотографии */}
        <PickButton onPick={onChange}>
          {src ? '🔄 Заменить фото' : '➕ Добавить фото'}
        </PickButton>
        {src && <button type="button" className="mini" onClick={() => onChange(null)}>🗑️ Удалить</button>}
      </div>
    </div>
  );
}

/* ==========================================================================
   9. НАСТРОЙКА ЦВЕТОВ И ТЕМ ОФОРМЛЕНИЯ
   ========================================================================== */
const SWATCHES = [
  ['#4f46e5', 'Индиго'], ['#2563eb', 'Синий'], ['#0d9488', 'Бирюзовый'], 
  ['#16a34a', 'Зелёный'], ['#d97706', 'Янтарный'], ['#e11d48', 'Малиновый']
];

function ColorPicker({ value, onChange }) {
  return (
    <div className="flex flex-col gap-3">
      {/* Быстрый выбор цвета из готовой палитры */}
      <div className="flex flex-wrap items-center gap-2">
        {SWATCHES.map(([hex, name]) => (
          <button 
            key={hex} 
            type="button" 
            className="swatch" 
            style={{ background: hex }} 
            title={`Выбрать ${name} цвет`}
            aria-pressed={value.toLowerCase() === hex} 
            onClick={() => onChange(hex)} 
          />
        ))}
      </div>
      {/* Пользовательский выбор произвольного цвета через палитру или HEX */}
      <div className="flex items-center gap-2">
        <label className="hint">Свой цвет:</label>
        <input type="color" value={value} onChange={(e) => onChange(e.target.value)} title="Кликните для выбора любого цвета" />
        <input className="field hex" value={value} onChange={(e) => HEX.test(e.target.value) && onChange(e.target.value)} placeholder="#000000" />
      </div>
    </div>
  );
}

/* ==========================================================================
   10. ПАНЕЛЬ УПРАВЛЕНИЯ САЙТОМ (Редактирование страниц, цветов и данных)
   ========================================================================== */
function AdminPanel({ cfg, set, page, go, act }) {
  const [tab, setTab] = useState('pages');
  const [open, setOpen] = useState(true);

  return (
    <section className="mx-auto w-full max-w-5xl px-4 pt-5">
      <div className="panel">
        <div className="mb-4 flex flex-wrap items-center justify-between gap-3">
          <div className="seg">
            <button type="button" aria-pressed={tab === 'pages'} onClick={() => { setTab('pages'); setOpen(true); }}>📄 Страницы</button>
            <button type="button" aria-pressed={tab === 'design'} onClick={() => { setTab('design'); setOpen(true); }}>🎨 Оформление и цвета</button>
          </div>
          <button type="button" className="tool-btn" onClick={() => setOpen(!open)}>
            {open ? 'Свернуть панель' : 'Развернуть панель'}
          </button>
        </div>

        {open && tab === 'pages' && (
          <div className="flex flex-col gap-4">
            <div className="flex flex-wrap items-center gap-2">
              <span className="hint">Выберите страницу для редактирования:</span>
              {cfg.pages.map((p) => (
                <button key={p.id} type="button" className="chip" aria-pressed={p.id === page.id} onClick={() => go(p.id)}>
                  {p.title || 'Без названия'}
                </button>
              ))}
              <button type="button" className="tool-btn solid" onClick={act.addPage}>➕ Новая страница</button>
            </div>
            
            <div className="flex flex-wrap items-center gap-4 pt-2">
              <div>
                <label className="label">Название текущей страницы</label>
                <input className="field" value={page.title} onChange={(e) => act.setPage(page.id, { title: e.target.value })} />
              </div>
              {cfg.pages.length > 1 && (
                <button type="button" className="tool-btn danger" onClick={() => act.delPage(page.id)}>Удалить страницу</button>
              )}
            </div>
          </div>
        )}

        {open && tab === 'design' && (
          <div className="grid gap-6 md:grid-cols-2">
            <div>
              <span className="label">Основной акцентный цвет сайта</span>
              <p className="hint mb-2">Изменяет цвет кнопок, активных ссылок и акцентных элементов.</p>
              <ColorPicker value={cfg.primary} onChange={(v) => set({ primary: v })} />
            </div>
            
            <div className="flex flex-col gap-4">
              <div>
                <span className="label">Тема оформления</span>
                <div className="seg mt-1">
                  <button type="button" aria-pressed={cfg.theme === 'light'} onClick={() => set({ theme: 'light' })}>☀️ Светлая</button>
                  <button type="button" aria-pressed={cfg.theme === 'dark'} onClick={() => set({ theme: 'dark' })}>🌙 Тёмная</button>
                </div>
              </div>

              <div>
                <span className="label">Скругление углов элементов</span>
                <div className="seg mt-1">
                  {[['0', 'Острые'], ['8', 'Прямые'], ['14', 'Закругленные'], ['24', 'Круглые']].map(([val, label]) => (
                    <button key={val} type="button" aria-pressed={String(cfg.radius) === val} onClick={() => set({ radius: Number(val) })}>{label}</button>
                  ))}
                </div>
              </div>
            </div>
          </div>
        )}
      </div>
      <p className="hint mt-2">💡 **Подсказка**: Нажмите на любой текст прямо на странице ниже, чтобы отредактировать его.</p>
    </section>
  );
}

/* ==========================================================================
   11. БЛОКИ КОНТЕНТА (РЕНДЕР И РЕДАКТИРОВАНИЕ БЛОКОВ)
   ========================================================================== */
function HeroBlock({ b, patch }) {
  return (
    <div className="grid items-center gap-8 md:grid-cols-2">
      <div className="flex flex-col gap-4">
        <Editable className="eyebrow" value={b.eyebrow} onChange={(v) => patch({ eyebrow: v })} placeholder="Нажмите для ввода надзаголовка..." />
        <Editable as="h1" className="hero-title" value={b.title} onChange={(v) => patch({ title: v })} placeholder="Нажмите для ввода главного заголовка..." />
        <Editable as="p" className="hero-text" multiline value={b.text} onChange={(v) => patch({ text: v })} placeholder="Нажмите для ввода описания..." />
        <div className="btn">
          <Editable value={b.btn?.label || 'Текст кнопки'} onChange={(v) => patch({ btn: { ...b.btn, label: v } })} placeholder="Текст кнопки..." />
        </div>
      </div>
      <Photo src={b.image} onChange={(v) => patch({ image: v })} ratio="4/3" />
    </div>
  );
}

function TextBlock({ b, patch }) {
  return (
    <div className="flex flex-col gap-4">
      <Editable as="h2" className="h2" value={b.title} onChange={(v) => patch({ title: v })} placeholder="Заголовок текстового раздела..." />
      <Editable as="div" className="prose" multiline value={b.text} onChange={(v) => patch({ text: v })} placeholder="Введите текст раздела..." />
    </div>
  );
}

function CardsBlock({ b, patch }) {
  const updateItem = (id, fields) => {
    patch({ items: b.items.map(item => item.id === id ? { ...item, ...fields } : item) });
  };

  return (
    <div className="flex flex-col gap-6">
      <Editable as="h2" className="h2" value={b.title} onChange={(v) => patch({ title: v })} placeholder="Заголовок блока карточек..." />
      <div className={`grid-n c${b.cols || 3}`}>
        {b.items.map((item) => (
          <div className="card" key={item.id}>
            <Photo src={item.image} onChange={(v) => updateItem(item.id, { image: v })} ratio="16/10" />
            <Editable className="pill" value={item.tag} onChange={(v) => updateItem(item.id, { tag: v })} placeholder="Метка..." />
            <Editable as="h3" className="font-bold text-lg" value={item.title} onChange={(v) => updateItem(item.id, { title: v })} placeholder="Заголовок карточки..." />
            <Editable as="p" multiline value={item.text} onChange={(v) => updateItem(item.id, { text: v })} placeholder="Описание карточки..." />
          </div>
        ))}
        <button type="button" className="add-tile" onClick={() => patch({ items: [...b.items, mk({ tag: 'Новая метка', title: 'Новая карточка', text: 'Описание', image: null })] })}>
          ➕ Добавить карточку
        </button>
      </div>
    </div>
  );
}

const VIEWS = { hero: HeroBlock, text: TextBlock, cards: CardsBlock };

function BlockFrame({ b, patch, onRemove }) {
  const View = VIEWS[b.type] || TextBlock;
  return (
    <div className="frame">
      <div className="frame-bar">
        <span className="label">Тип блока: {TYPES[b.type]?.name || b.type}</span>
        <button type="button" className="icon-btn danger" onClick={onRemove} title="Удалить весь блок">🗑️ Удалить блок</button>
      </div>
      <div className="blk">
        <View b={b} patch={patch} />
      </div>
    </div>
  );
}

/* ==========================================================================
   12. ОСНОВНОЙ КОМПОНЕНТ ПРИЛОЖЕНИЯ
   ========================================================================== */
function App() {
  const [cfg, setCfg] = useState(makeDefault);
  const [pageId, setPageId] = useState('home');

  /* Сохранение изменений сайта в хранилище браузера */
  useEffect(() => {
    try {
      localStorage.setItem(KEY, JSON.stringify(cfg));
    } catch (e) {}
  }, [cfg]);

  useLayoutEffect(() => {
    window.siteTheme.apply(cfg);
  }, [cfg]);

  const page = cfg.pages.find((p) => p.id === pageId) || cfg.pages[0];

  const set = (fields) => setCfg((prev) => ({ ...prev, ...fields }));
  
  const act = {
    setPage: (pid, fields) => setCfg((prev) => ({
      ...prev,
      pages: prev.pages.map((p) => p.id === pid ? { ...p, ...fields } : p)
    })),
    addPage: () => {
      const id = uid();
      setCfg((prev) => ({
        ...prev,
        pages: [...prev.pages, { id, title: 'Новая страница', nav: true, blocks: [newBlock('hero')] }]
      }));
      setPageId(id);
    },
    delPage: (id) => {
      if (cfg.pages.length <= 1) return;
      setCfg((prev) => ({ ...prev, pages: prev.pages.filter((p) => p.id !== id) }));
      setPageId(cfg.pages[0].id);
    },
    addBlock: (type) => {
      act.setPage(page.id, { blocks: [...page.blocks, newBlock(type)] });
    },
    patchBlock: (bid, fields) => {
      act.setPage(page.id, {
        blocks: page.blocks.map((b) => b.id === bid ? { ...b, ...fields } : b)
      });
    },
    removeBlock: (bid) => {
      act.setPage(page.id, { blocks: page.blocks.filter((b) => b.id !== bid) });
    }
  };

  return (
    <Ctx.Provider value={{ cfg }}>
      <div className="flex min-h-screen flex-col">
        {/* Панель управления и настроек */}
        <AdminPanel cfg={cfg} set={set} page={page} go={setPageId} act={act} />

        {/* Просмотр сайта и интерактивное редактирование */}
        <div className="flex-1">
          {/* Шапка сайта */}
          <header className="mx-auto flex w-full max-w-5xl items-center justify-between px-4 py-6">
            <div className="brand">
              {cfg.logo ? (
                <img src={cfg.logo} alt="Логотип" className="logo" />
              ) : (
                <span className="mark" />
              )}
              {/* Изменение названия бренда/сайта */}
              <Editable value={cfg.brand} onChange={(v) => set({ brand: v })} placeholder="Название бренда..." />
              <PickButton onPick={(url) => set({ logo: url })} className="mini">
                📷 {cfg.logo ? 'Сменить лого' : 'Загрузить лого'}
              </PickButton>
            </div>

            {/* Навигация по страницам */}
            <nav className="flex gap-4">
              {cfg.pages.map((p) => (
                <button key={p.id} type="button" className="navlink" aria-current={p.id === page.id ? 'page' : undefined} onClick={() => setPageId(p.id)}>
                  {p.title}
                </button>
              ))}
            </nav>
          </header>

          {/* Контент текущей страницы */}
          <main className="mx-auto w-full max-w-5xl px-4">
            {page.blocks.map((b) => (
              <BlockFrame 
                key={b.id} 
                b={b} 
                patch={(fields) => act.patchBlock(b.id, fields)} 
                onRemove={() => act.removeBlock(b.id)} 
              />
            ))}

            {/* Добавление новых блоков */}
            <section className="panel mt-6">
              <span className="label">➕ Добавить новый блок на страницу</span>
              <div className="addpick mt-3">
                {Object.entries(TYPES).map(([type, meta]) => (
                  <button key={type} type="button" onClick={() => act.addBlock(type)}>
                    <strong>{meta.name}</strong>
                    <small>{meta.hint}</small>
                  </button>
                ))}
              </div>
            </section>
          </main>

          {/* Подвал сайта */}
          <footer className="mx-auto w-full max-w-5xl px-4 py-10 mt-12 border-t">
            <div className="flex justify-between items-center text-sm">
              <Editable value={cfg.contact} onChange={(v) => set({ contact: v })} placeholder="Контакты..." />
              <Editable value={cfg.footer} onChange={(v) => set({ footer: v })} placeholder="Текст подвала..." />
            </div>
          </footer>
        </div>
      </div>
    </Ctx.Provider>
  );
}

/* Отрисовка приложения в корневой div */
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
