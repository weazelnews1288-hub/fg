<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Weazel News</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Lora:wght@400;500;600&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Макет: липкая панель ролей, панель администратора с вкладками, затем сайт: шапка с меню страниц, блоки выбранной страницы, подвал. */
  :root {
    --bg: #fafaf9;
    --surface: #ffffff;
    --fg: #8E0A10;
    --muted: #6a6a75;
    --line: #e6e6ea;
    --seg: #ececef;
    --danger: #d92d20;
    --primary: #8E0A10;
    --on-primary: #ffffff;
    --font-body: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-head: var(--font-body);
    --head-ls: -.03em;
    --head-scale: 1;
    --font-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    --radius: 14px;
  }
  :root, .scope {
    --primary-text: var(--primary);
    --primary-soft: color-mix(in srgb, var(--primary) 9%, var(--bg));
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0e11; --surface: #17171b; --fg: #f2f2f4; --muted: #9b9ba7; --line: #27272d; --seg: #212127; --danger: #f97066;
      color-scheme: dark;
    }
    :root:not([data-theme="light"]), :root:not([data-theme="light"]) .scope {
      --primary-text: color-mix(in srgb, var(--primary) 62%, #ffffff);
      --primary-soft: color-mix(in srgb, var(--primary) 16%, var(--bg));
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e0e11; --surface: #17171b; --fg: #f2f2f4; --muted: #9b9ba7; --line: #27272d; --seg: #212127; --danger: #f97066;
    color-scheme: dark;
  }
  :root[data-theme="dark"], :root[data-theme="dark"] .scope {
    --primary-text: color-mix(in srgb, var(--primary) 62%, #ffffff);
    --primary-soft: color-mix(in srgb, var(--primary) 16%, var(--bg));
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 16px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    transition: background-color .25s, color .25s;
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .muted { color: var(--muted); }
  .label { font-family: var(--font-mono); font-size: .6875rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  /* ---------- Панель ролей ---------- */
  .rolebar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--seg); border-radius: 10px; max-width: 100%; }
  .seg button {
    font: inherit; font-size: .875rem; line-height: 1.2; padding: 7px 12px; border: 0; border-radius: 8px;
    background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .seg button:hover { color: var(--fg); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgb(0 0 0 / .1); }
  .seg.sm button { padding: 5px 10px; font-size: .8125rem; }
  .status { font-size: .8125rem; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }
  .status[data-bad="true"] { color: var(--danger); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); display: inline-block; flex: none; }

  /* ---------- Панель администратора ---------- */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px 20px; }
  .swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--surface); cursor: pointer; padding: 0; box-shadow: 0 0 0 1px var(--line); }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--fg); }
  input[type="color"] { width: 38px; height: 30px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
  .field {
    font: inherit; font-size: .875rem; padding: 8px 10px; width: 100%;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg);
  }
  .hex { width: 98px; font-family: var(--font-mono); }
  textarea.field { min-height: 84px; resize: vertical; font-family: var(--font-mono); font-size: .75rem; }
  .tool-btn {
    font: inherit; font-size: .875rem; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 8px 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
    transition: border-color .15s, background-color .15s;
  }
  .tool-btn:hover:not(:disabled) { border-color: var(--muted); }
  .tool-btn:disabled { opacity: .4; cursor: default; }
  .tool-btn.solid { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .tool-btn.solid:hover { filter: brightness(1.08); }
  .tool-btn.danger[data-armed="true"] { color: var(--danger); border-color: var(--danger); }
  .chip {
    font: inherit; font-size: .875rem; padding: 7px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  }
  .chip[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-text); }
  .check { display: inline-flex; align-items: center; gap: 8px; font-size: .875rem; cursor: pointer; }
  .check input { width: 16px; height: 16px; accent-color: var(--primary); }
  .hint { font-size: .8125rem; color: var(--muted); }
  kbd { font-family: var(--font-mono); font-size: .75rem; padding: 1px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); }
  .meter { height: 6px; border-radius: 99px; background: var(--seg); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--primary); }
  .meter[data-warn="true"] i { background: var(--danger); }
  .icon-btn {
    min-width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; padding: 0;
    border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer;
    font: inherit; font-size: .8125rem;
  }
  .icon-btn:hover:not(:disabled) { color: var(--fg); border-color: var(--muted); }
  .icon-btn:disabled { opacity: .35; cursor: default; }
  .icon-btn[aria-pressed="true"] { color: var(--primary-text); border-color: var(--primary); background: var(--primary-soft); }
  .icon-btn.danger[data-armed="true"] { padding: 0 10px; color: var(--danger); border-color: var(--danger); }
  .tools { display: inline-flex; gap: 6px; flex: none; }
  .mini {
    font: inherit; font-size: .75rem; padding: 5px 9px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); color: var(--fg); cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
    box-shadow: 0 1px 3px rgb(0 0 0 / .15);
  }
  .mini:hover { border-color: var(--muted); }

  /* ---------- Рамка блока в режиме администратора ---------- */
  .frame { position: relative; border: 1px dashed var(--line); border-radius: calc(var(--radius) + 6px); padding: 10px; margin-block: 12px; min-width: 0; }
  .frame:hover { border-color: color-mix(in srgb, var(--primary) 45%, var(--line)); }
  .frame-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 2px 10px; }
  .settings { display: flex; flex-wrap: wrap; gap: 14px 22px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  .choice { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .choice.grow { flex: 1 1 280px; }
  .addpick { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); }
  .addpick button {
    font: inherit; text-align: left; padding: 12px 14px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: flex; flex-direction: column; gap: 2px;
    transition: border-color .15s, background-color .15s;
  }
  .addpick button:hover { border-color: var(--primary); background: var(--primary-soft); }
  .addpick small { color: var(--muted); font-size: .75rem; line-height: 1.35; }

  /* ---------- Сайт ---------- */
  .brand { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-head); font-weight: 650; font-size: 1.125rem; letter-spacing: var(--head-ls); }
  .mark { width: 16px; height: 16px; border-radius: calc(var(--radius) * .35); background: var(--primary); display: inline-block; flex: none; }
  .logo { height: 26px; width: auto; max-width: 140px; object-fit: contain; flex: none; }
  .navlink {
    font: inherit; font-size: .9375rem; color: var(--muted); background: none; border: 0; padding: 4px 0; cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .navlink:hover { color: var(--fg); }
  .navlink[aria-current="page"] { color: var(--fg); border-bottom-color: var(--primary); }
  .rule { border-top: 1px solid var(--line); }

  .blk { display: flex; flex-direction: column; gap: 28px; padding-block: clamp(28px, 5vw, 56px); min-width: 0; }
  .hero-blk { padding-block: clamp(32px, 7vw, 88px); }
  .blk.bg-soft, .blk.bg-accent { padding-inline: clamp(20px, 4vw, 40px); border-radius: calc(var(--radius) * 1.6); margin-block: 8px; }
  .bg-soft { background: var(--primary-soft); }
  .bg-accent { background: var(--primary); color: var(--on-primary); }
  .bg-accent .lead, .bg-accent .hero-text, .bg-accent .muted, .bg-accent .cap { color: color-mix(in srgb, var(--on-primary) 82%, transparent); }
  .bg-accent .eyebrow { color: inherit; opacity: .85; }
  .bg-accent .btn { background: var(--on-primary); color: var(--primary); }
  .bg-accent .stat-value { color: inherit; }
  .bg-accent .editable:hover { outline-color: color-mix(in srgb, var(--on-primary) 60%, transparent); }
  .bg-accent .editable:focus { outline-color: var(--on-primary); background: color-mix(in srgb, var(--on-primary) 16%, transparent); }
  .bg-accent .add-tile { color: inherit; border-color: color-mix(in srgb, currentColor 40%, transparent); }
  .bg-accent .add-tile:hover { color: var(--primary-text); }

  .align-center .head { margin-inline: auto; text-align: center; }
  .align-center .lead, .align-center .prose, .align-center .faq { margin-inline: auto; }
  .align-center .btn { align-self: center; }
  .align-center .stat { text-align: center; }

  .head { display: flex; flex-direction: column; gap: 12px; max-width: 42rem; min-width: 0; }
  .head:empty { display: none; }
  .eyebrow { font-family: var(--font-mono); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--primary-text); }
  .hero-title { font-family: var(--font-head); font-size: calc(clamp(2.1rem, 5.2vw, 3.6rem) * var(--head-scale)); line-height: 1.1; font-weight: 600; letter-spacing: var(--head-ls); text-wrap: balance; overflow-wrap: anywhere; }
  .hero-text { font-size: 1.125rem; color: var(--muted); max-width: 52ch; }
  .h2 { font-family: var(--font-head); font-size: calc(clamp(1.5rem, 3vw, 2rem) * var(--head-scale)); line-height: 1.2; font-weight: 600; letter-spacing: var(--head-ls); text-wrap: balance; overflow-wrap: anywhere; }
  .lead { color: var(--muted); max-width: 56ch; }
  .prose { max-width: 68ch; font-size: 1.0625rem; }
  .ml { white-space: pre-wrap; }
  .btn {
    font: inherit; font-weight: 500; border: 0; cursor: pointer; display: inline-flex; align-items: center; align-self: flex-start;
    padding: 12px 22px; border-radius: calc(var(--radius) * .75); background: var(--primary); color: var(--on-primary);
    text-decoration: none; transition: filter .15s;
  }
  a.btn:hover, button.btn:hover { filter: brightness(1.08); }

  .art-wrap { position: relative; justify-self: end; width: 100%; max-width: 340px; }
  .art { position: relative; width: 100%; aspect-ratio: 1 / 1; }
  .art i { position: absolute; display: block; }
  .art .a { inset: 0 22% 22% 0; background: var(--primary); border-radius: calc(var(--radius) * 2.2); }
  .art .b { right: 0; bottom: 0; width: 58%; height: 58%; border-radius: 50%; background: var(--primary-soft); border: 1px solid var(--line); box-shadow: 0 0 0 8px var(--bg); }
  .art .c { left: 0; bottom: 0; width: 36%; height: 18%; background-image: radial-gradient(var(--muted) 1.4px, transparent 1.7px); background-size: 12px 12px; opacity: .55; }

  .photo { position: relative; border-radius: var(--radius); overflow: hidden; background: var(--primary-soft); min-width: 0; width: 100%; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo.auto img { height: auto; }
  .photo.auto.empty { min-height: 180px; }
  .photo-empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--primary-text); font-size: .875rem; padding: 12px; text-align: center; }
  .photo-tools { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .cap { font-size: .875rem; color: var(--muted); }
  .imgblk { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .imgblk.narrow { max-width: 720px; margin-inline: auto; }
  .fig { display: flex; flex-direction: column; gap: 8px; min-width: 0; margin: 0; }

  .split { display: grid; gap: 32px; align-items: center; }
  @media (min-width: 768px) { .split.has-media { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .split.left .media { order: -1; }

  .grid-n { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  .grid-n.stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (min-width: 640px) { .grid-n.c2, .grid-n.c3, .grid-n.c4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 960px) { .grid-n.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .grid-n.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .grid-n.stats.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (min-width: 640px) { .grid-n.stats.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .grid-n.stats.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

  .card {
    background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; transition: border-color .2s;
  }
  .card:hover { border-color: color-mix(in srgb, var(--primary) 40%, var(--line)); }
  .card .photo { border-radius: calc(var(--radius) * .7); }
  .card h3 { font-family: var(--font-head); font-size: 1.125rem; line-height: 1.35; font-weight: 600; letter-spacing: calc(var(--head-ls) / 2); overflow-wrap: anywhere; }
  .card p { color: var(--muted); font-size: .9375rem; overflow-wrap: anywhere; }
  .pill { display: inline-block; font-family: var(--font-mono); font-size: .6875rem; letter-spacing: .06em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary-text); }
  .add-tile {
    font: inherit; min-height: 120px; border: 1.5px dashed var(--line); border-radius: var(--radius);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    background: transparent; color: var(--muted); cursor: pointer; transition: border-color .15s, background-color .15s, color .15s;
  }
  .add-tile:hover { border-color: var(--primary); color: var(--primary-text); background: var(--primary-soft); }

  .stat { display: flex; flex-direction: column; gap: 4px; padding-top: 14px; min-width: 0; border-top: 2px solid color-mix(in srgb, currentColor 25%, transparent); }
  .stat-value { font-family: var(--font-head); font-size: calc(clamp(1.75rem, 4vw, 2.5rem) * var(--head-scale)); font-weight: 600; letter-spacing: var(--head-ls); line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--primary-text); overflow-wrap: anywhere; }

  .faq { display: flex; flex-direction: column; max-width: 48rem; width: 100%; }
  .faq-item { border-top: 1px solid color-mix(in srgb, currentColor 18%, transparent); padding: 16px 0; }
  .faq-item:last-child { border-bottom: 1px solid color-mix(in srgb, currentColor 18%, transparent); }
  .faq-q { width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 16px; font: inherit; font-weight: 500; font-size: 1.0625rem; background: none; border: 0; color: inherit; cursor: pointer; padding: 0; }
  .faq-qt { font-weight: 500; font-size: 1.0625rem; flex: 1; min-width: 0; }
  .faq-a { margin-top: 8px; color: var(--muted); white-space: pre-wrap; }
  .bg-accent .faq-a { color: color-mix(in srgb, var(--on-primary) 82%, transparent); }
  .chev { display: inline-flex; transition: transform .2s; flex: none; }
  .chev[data-open="true"] { transform: rotate(180deg); }

  .divider { display: flex; align-items: center; }
  .divider.s { height: 16px; } .divider.m { height: 40px; } .divider.l { height: 88px; }
  .divider hr { width: 100%; border: 0; border-top: 1px solid var(--line); }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px);
    background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: .875rem; box-shadow: 0 6px 24px rgb(0 0 0 / .25);
  }

  /* ---------- Редактирование на месте ---------- */
  .editable { outline: 1.5px dashed transparent; outline-offset: 4px; border-radius: 6px; cursor: text; min-width: 2ch; transition: outline-color .15s, background-color .15s; }
  .editable:hover { outline-color: color-mix(in srgb, var(--primary) 55%, transparent); }
  .editable:focus { outline: 2px solid var(--primary); outline-offset: 4px; background: var(--primary-soft); }
  .editable:empty::before { content: attr(data-placeholder); color: var(--muted); opacity: .7; }
</style>

<!-- Применяет сохранённые тему, цвет, шрифт и скругление до первой отрисовки React -->
<script>
(function () {
  var HEX = /^#[0-9a-f]{6}$/i;
  var SANS = "system-ui,-apple-system,'Segoe UI',sans-serif";
  var FONTS = {
    modern:   { label: 'Современный',    body: "'Onest'," + SANS,    head: "'Onest'," + SANS,              ls: '-.03em', scale: 1 },
    strict:   { label: 'Строгий',        body: "'Manrope'," + SANS,  head: "'Manrope'," + SANS,            ls: '-.03em', scale: 1 },
    magazine: { label: 'Журнал',         body: "'Onest'," + SANS,    head: "'Playfair Display',Georgia,serif", ls: '-.01em', scale: 1.05 },
    classic:  { label: 'Классика',       body: "'Lora',Georgia,serif", head: "'Lora',Georgia,serif",       ls: '-.01em', scale: 1 },
    bold:     { label: 'Выразительный',  body: "'Onest'," + SANS,    head: "'Unbounded','Onest'," + SANS,  ls: '-.02em', scale: .78 }
  };
  function lin(v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
  function onColor(h) {
    var n = parseInt(h.slice(1), 16);
    var L = 0.2126 * lin((n >> 16) & 255) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255);
    return 1.05 / (L + 0.05) >= (L + 0.05) / 0.05 ? '#ffffff' : '#111114';
  }
  window.siteTheme = {
    fonts: FONTS,
    on: onColor,
    apply: function (cfg) {
      cfg = cfg || {};
      var r = document.documentElement, f = FONTS[cfg.font] || FONTS.modern;
      var hex = HEX.test(cfg.primary || '') ? cfg.primary : '#8E0A10';
      var rad = [0, 8, 14, 24].indexOf(cfg.radius) >= 0 ? cfg.radius : 14;
      r.setAttribute('data-theme', cfg.theme === 'dark' ? 'dark' : 'light');
      r.style.setProperty('--primary', hex);
      r.style.setProperty('--on-primary', onColor(hex));
      r.style.setProperty('--font-body', f.body);
      r.style.setProperty('--font-head', f.head);
      r.style.setProperty('--head-ls', f.ls);
      r.style.setProperty('--head-scale', String(f.scale));
      r.style.setProperty('--radius', rad + 'px');

      out[k] = (Array.isArray(out[k]) ? out[k] : []).filter((x) => x && typeof x === 'object')
        .map((x) => ({ ...x, id: typeof x.id === 'string' ? x.id : uid(), ...('image' in x ? { image: cleanImg(x.image) } : {}), ...('src' in x ? { src: cleanImg(x.src) } : {}) }));
    }
  }
  return out;
}

function sanitize(p) {
  const d = makeDefault();
  if (!p || typeof p !== 'object' || !Array.isArray(p.pages) || !p.pages.length) return d;
  const s = (v, f) => (typeof v === 'string' ? v : f);
  const pages = p.pages.filter((x) => x && typeof x === 'object').map((pg) => ({
    id: s(pg.id, uid()), title: s(pg.title, 'Страница'), nav: pg.nav !== false,
    accent: typeof pg.accent === 'string' && HEX.test(pg.accent) ? pg.accent : null,
    blocks: Array.isArray(pg.blocks) ? pg.blocks.map(normBlock).filter(Boolean) : [],
  }));
  return {
    v: 2,
    theme: p.theme === 'dark' ? 'dark' : 'light',
    primary: typeof p.primary === 'string' && HEX.test(p.primary) ? p.primary : d.primary,
    font: window.siteTheme.fonts[p.font] ? p.font : 'modern',
    radius: [0, 8, 14, 24].includes(p.radius) ? p.radius : 14,
    brand: s(p.brand, d.brand), logo: cleanImg(p.logo), contact: s(p.contact, d.contact), footer: s(p.footer, d.footer),
    pages: pages.length ? pages : d.pages,
  };
}

function migrateV1(o) {
  const c = makeDefault();
  if (o.theme === 'dark') c.theme = 'dark';
  if (typeof o.primary === 'string' && HEX.test(o.primary)) c.primary = o.primary;
  if (typeof o.brand === 'string') c.brand = o.brand;
  if (typeof o.contact === 'string') c.contact = o.contact;
  if (typeof o.footer === 'string') c.footer = o.footer;
  const home = c.pages[0];
  const hero = home.blocks.find((b) => b.type === 'hero');
  if (o.hero && hero) {
    hero.eyebrow = o.hero.eyebrow ?? hero.eyebrow; hero.title = o.hero.title ?? hero.title;
    hero.text = o.hero.text ?? hero.text; hero.btn.label = o.hero.cta ?? hero.btn.label;
  }
  const cards = home.blocks.find((b) => b.type === 'cards');
  if (Array.isArray(o.cards) && cards) {
    cards.title = o.cardsTitle ?? cards.title; cards.lead = o.cardsLead ?? cards.lead;
    cards.items = o.cards.map((x) => mk({ tag: x.tag || '', title: x.title || '', text: x.text || '', image: null }));
  }
  return sanitize(c);
}

function loadConfig() {
  if (window.__BOOT && window.__BOOT.cfg) { try { return sanitize(window.__BOOT.cfg); } catch (e) {} return makeDefault(); }
  if (window.__BOOT) return makeDefault();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return sanitize(JSON.parse(raw));

  return makeDefault();
}

}

/* ---------- Фото: сжатие и сохранение как data URL ---------- */
async function fileToDataUrl(file, { max = 1200, type = 'image/jpeg', q = 0.72, limit = 280000 } = {}) {
  const src = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  const iw = img.naturalWidth || 300, ih = img.naturalHeight || 300;
  let side = max, out = '';
  for (let n = 0; n < 5; n++) {
    const k = Math.min(1, side / Math.max(iw, ih));
    const w = Math.max(1, Math.round(iw * k)), h = Math.max(1, Math.round(ih * k));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d');
    if (type === 'image/jpeg') { x.fillStyle = '#ffffff'; x.fillRect(0, 0, w, h); }
    x.drawImage(img, 0, 0, w, h);
    out = c.toDataURL(type, q);
    if (out.length <= limit) break;
    side = Math.round(side * 0.75);
  }
  return out;
}

/* ---------- Текст, редактируемый на месте ---------- */
const PLAIN = (() => { try { const d = document.createElement('div'); d.contentEditable = 'plaintext-only'; return d.contentEditable === 'plaintext-only'; } catch (e) { return false; } })();

function Editable({ value, onChange, as: Tag = 'span', className = '', placeholder = 'Введите текст', label, multiline = false, hideEmpty = true }) {
  const { admin } = useCtx();
  const ref = useRef(null);
  useLayoutEffect(() => {
    const el = ref.current;
    if (el && el.textContent !== value && document.activeElement !== el) el.textContent = value;
  }, [value, admin]);

  if (!admin) {
    if (hideEmpty && !value) return null;
    return <Tag className={className + (multiline ? ' ml' : '')}>{value}</Tag>;
  }
  const commit = (el) => {
    let t = el.innerText.replace(/\r/g, '');
    t = multiline ? t.replace(/\n{3,}/g, '\n\n').trim() : t.replace(/\s+/g, ' ').trim();
    if (t !== value) onChange(t); else el.textContent = value;
  };
  return (
    <Tag
      ref={ref}
      className={className + (multiline ? ' ml' : '') + ' editable'}
      contentEditable={PLAIN ? 'plaintext-only' : true}
      suppressContentEditableWarning
      spellCheck={false}
      role="textbox"
      aria-multiline={multiline}
      aria-label={label || placeholder}
      data-placeholder={placeholder}
      onBlur={(e) => commit(e.currentTarget)}
      onKeyDown={(e) => {
        if (e.key === 'Escape') { e.currentTarget.textContent = value; e.currentTarget.blur(); return; }
        if (e.key === 'Enter' && (!multiline || e.ctrlKey || e.metaKey)) { e.preventDefault(); e.currentTarget.blur(); }
      }}
      onPaste={(e) => {
        e.preventDefault();
        let text = (e.clipboardData || window.clipboardData).getData('text');
        text = multiline ? text.replace(/\r/g, '') : text.replace(/\s+/g, ' ');
        if (!document.execCommand('insertText', false, text)) e.currentTarget.textContent += text;
      }}
    />
  );
}

      <div className={'grid-n c' + b.cols}>
        {b.items.map((it) => (
          <figure className="fig" key={it.id}>
            <Photo src={it.src} ratio="4/3" clearLabel="Удалить" onChange={(v) => (v ? L.update(it.id, { src: v }) : L.remove(it.id))} />
            <Editable as="figcaption" className="cap" value={it.caption} placeholder="Подпись" onChange={(v) => L.update(it.id, { caption: v })} />
          </figure>
        ))}
        {admin && <PickButton multiple className="add-tile" onPick={(u) => L.add({ src: u, caption: '' })}><Icon n="plus" size={20} /><span>Добавить фото</span></PickButton>}
      </div>
    </>
  );
}
function Stats({ b, patch }) {
  const { admin } = useCtx();
  const L = listOps(patch, 'items');
  return (
    <>
      <Head b={b} patch={patch} />
      <div className={'grid-n stats c' + b.cols}>
        {b.items.map((s, i) => (
          <div className="stat" key={s.id}>
            {admin && <div className="flex justify-end"><ItemTools i={i} count={b.items.length} what="показатель" onMove={(d) => L.move(s.id, d)} onRemove={() => L.remove(s.id)} /></div>}
            <Editable as="div" className="stat-value" value={s.value} placeholder="Число" onChange={(v) => L.update(s.id, { value: v })} />
            <Editable as="div" className="muted" value={s.label} placeholder="Подпись" onChange={(v) => L.update(s.id, { label: v })} />
          </div>
        ))}
        {admin && <AddTile min={110} onClick={() => L.add({ value: '0', label: 'подпись' })}>Добавить показатель</AddTile>}
      </div>
    </>
  );
}
function Faq({ b, patch }) {
  const { admin } = useCtx();
  const L = listOps(patch, 'items');
  const [open, setOpen] = useState({});
  return (
    <>
      <Head b={b} patch={patch} />
      <div className="faq">
        {b.items.map((it, i) => (
          <div className="faq-item" key={it.id}>
            {admin ? (
              <>
                <div className="flex items-start justify-between gap-3">
                  <Editable as="div" className="faq-qt" value={it.q} placeholder="Вопрос" onChange={(v) => L.update(it.id, { q: v })} />
                  <ItemTools i={i} count={b.items.length} what="вопрос" onMove={(d) => L.move(it.id, d)} onRemove={() => L.remove(it.id)} />
                </div>
                <Editable as="div" className="faq-a" value={it.a} multiline placeholder="Ответ" onChange={(v) => L.update(it.id, { a: v })} />
              </>
            ) : (
              <>
                <button type="button" className="faq-q" aria-expanded={!!open[it.id]} onClick={() => setOpen((o) => ({ ...o, [it.id]: !o[it.id] }))}>
                  <span>{it.q}</span><span className="chev" data-open={!!open[it.id]}><Icon n="down" /></span>
                </button>
                {open[it.id] && <p className="faq-a">{it.a}</p>}
              </>
            )}
          </div>
        ))}
        {admin && <div className="pt-4"><button type="button" className="tool-btn" onClick={() => L.add({ q: 'Новый вопрос', a: 'Ответ на вопрос.' })}><Icon n="plus" />Добавить вопрос</button></div>}
      </div>
    </>
  );
}
function Cta({ b, patch }) {
  return (
    <>
      <div className="head">
        <Editable as="h2" className="h2" value={b.title} placeholder="Заголовок" onChange={(v) => patch({ title: v })} />
        <Editable as="p" className="lead" value={b.text} multiline placeholder="Текст" onChange={(v) => patch({ text: v })} />
      </div>
      <Btn btn={b.btn} onChange={(btn) => patch({ btn })} />
    </>
  );
}
function Divider({ b }) {
  return <div className={'divider ' + b.size}>{b.line && <hr />}</div>;
}

/* ---------- Главный компонент отрисовки блока ---------- */
function BlockView({ b, pageId }) {
  const { admin, act } = useCtx();
  const patch = (f) => act.patch(pageId, b.id, f);
  const isHero = b.type === 'hero';

  let content = null;
  switch (b.type) {
    case 'hero': content = <Hero b={b} patch={patch} />; break;
    case 'text': content = <TextBlock b={b} patch={patch} />; break;
    case 'cards': content = <Cards b={b} patch={patch} />; break;
    case 'image': content = <ImageBlock b={b} patch={patch} />; break;
    case 'split': content = <Split b={b} patch={patch} />; break;
    case 'gallery': content = <Gallery b={b} patch={patch} />; break;
    case 'stats': content = <Stats b={b} patch={patch} />; break;
    case 'faq': content = <Faq b={b} patch={patch} />; break;
    case 'cta': content = <Cta b={b} patch={patch} />; break;
    case 'divider': content = <Divider b={b} />; break;
    default: return null;
  }

  const inner = (
    <section className={'blk ' + (isHero ? 'hero-blk ' : '') + 'bg-' + b.bg + ' align-' + b.align}>
      {content}
    </section>
  );

  if (!admin) return inner;
  return <BlockFrame b={b} i={b._i} count={b._count} act={act} pageId={pageId}>{inner}</BlockFrame>;
}

/* ---------- Отрисовка страницы ---------- */
function PageView({ page }) {
  const { admin, act } = useCtx();
  const [pickType, setPickType] = useState(false);

  const blocks = page.blocks.map((b, i) => ({ ...b, _i: i, _count: page.blocks.length }));

  return (
    <div className="flex flex-col min-w-0">
      {blocks.map((b) => <BlockView key={b.id} b={b} pageId={page.id} />)}

      {admin && (
        <div className="mt-8 mb-12 flex flex-col items-center gap-4">
          {!pickType ? (
            <button type="button" className="tool-btn solid" onClick={() => setPickType(true)}>
              <Icon n="plus" />Добавить блок
            </button>
          ) : (
            <div className="panel w-full max-w-2xl flex flex-col gap-4">
              <div className="flex items-center justify-between">
                <span className="font-semibold">Выберите тип блока</span>
                <button type="button" className="mini" onClick={() => setPickType(false)}>Отмена</button>
              </div>
              <div className="addpick">
                {Object.entries(TYPES).map(([type, meta]) => (
                  <button key={type} type="button" onClick={() => { act.add(page.id, type); setPickType(false); }}>
                    <strong>{meta.name}</strong>
                    <small>{meta.hint}</small>
                  </button>
                ))}
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ---------- Панель управления АДМИНА ---------- */
function AdminPanel({ cfg, act, activePageId, setPageId }) {
  const [tab, setTab] = useState('pages');
  const { saveStatus, quotaUsed } = useCtx();

  return (
    <div className="mb-8 flex flex-col gap-4">
      <div className="flex flex-wrap items-center justify-between gap-4 border-b border-[var(--line)] pb-3">
        <div className="seg">
          <button type="button" aria-pressed={tab === 'pages'} onClick={() => setTab('pages')}>Страницы</button>
          <button type="button" aria-pressed={tab === 'style'} onClick={() => setTab('style')}>Стиль и Темы</button>
          <button type="button" aria-pressed={tab === 'brand'} onClick={() => setTab('brand')}>Шапка и Подвал</button>
        </div>
        <div className="status" data-bad={quotaUsed > 80}>
          <span className="dot" />
          <span>{saveStatus}</span>
        </div>
      </div>

      {tab === 'pages' && (
        <div className="panel flex flex-col gap-4">
          <div className="flex flex-wrap gap-2 items-center">
            {cfg.pages.map((p, i) => (
              <div key={p.id} className="flex items-center gap-1 bg-[var(--bg)] border border-[var(--line)] rounded-lg p-1">
                <button type="button" className="navlink px-2 text-sm" aria-current={p.id === activePageId ? 'page' : undefined} onClick={() => setPageId(p.id)}>
                  {p.title || 'Без названия'}
                </button>
                <div className="tools">
                  <button type="button" className="icon-btn" disabled={i === 0} onClick={() => act.movePage(p.id, -1)}><Icon n="left" /></button>
                  <button type="button" className="icon-btn" disabled={i === cfg.pages.length - 1} onClick={() => act.movePage(p.id, 1)}><Icon n="right" /></button>
                  <Confirm label="Удалить страницу" disabled={cfg.pages.length <= 1} onConfirm={() => act.removePage(p.id)} />
                </div>
              </div>
            ))}
            <button type="button" className="tool-btn" onClick={() => act.addPage()}><Icon n="plus" />Страница</button>
          </div>

          {cfg.pages.find((p) => p.id === activePageId) && (
            <div className="flex flex-wrap gap-4 items-center pt-2 border-t border-[var(--line)]">
              <div className="flex items-center gap-2">
                <span className="label">Название:</span>
                <input className="field" style={{ width: 180 }} value={cfg.pages.find((p) => p.id === activePageId).title} onChange={(e) => act.patchPage(activePageId, { title: e.target.value })} />
              </div>
              <label className="check">
                <input type="checkbox" checked={cfg.pages.find((p) => p.id === activePageId).nav} onChange={(e) => act.patchPage(activePageId, { nav: e.target.checked })} />
                <span>Показывать в меню</span>
              </label>
            </div>
          )}
        </div>
      )}

      {tab === 'style' && (
        <div className="panel flex flex-wrap gap-6 items-center">
          <Choice label="Тема" value={cfg.theme} onChange={(v) => act.setTheme(v)} options={[['light', 'Светлая'], ['dark', 'Тёмная']]} />
          <div className="choice">
            <span className="label">Основной цвет</span>
            <div className="flex items-center gap-2">
              <input type="color" value={cfg.primary} onChange={(e) => act.setPrimary(e.target.value)} />
              <input className="field hex" value={cfg.primary} onChange={(e) => HEX.test(e.target.value) && act.setPrimary(e.target.value)} />
            </div>
          </div>
          <Choice label="Шрифт" value={cfg.font} onChange={(v) => act.setFont(v)} options={Object.entries(window.siteTheme.fonts).map(([k, f]) => [k, f.label])} />
          <Choice label="Скругления" value={cfg.radius} onChange={(v) => act.setRadius(Number(v))} options={[['0', '0'], ['8', '8px'], ['14', '14px'], ['24', '24px']]} />
        </div>
      )}

      {tab === 'brand' && (
        <div className="panel flex flex-wrap gap-6 items-center">
          <div className="choice grow">
            <span className="label">Название бренда</span>
            <input className="field" value={cfg.brand} onChange={(e) => act.setBrand(e.target.value)} />
          </div>
          <div className="choice grow">
            <span className="label">Контактный Email</span>
            <input className="field" value={cfg.contact} onChange={(e) => act.setContact(e.target.value)} />
          </div>
          <div className="choice grow">
            <span className="label">Текст в подвале</span>
            <input className="field" value={cfg.footer} onChange={(e) => act.setFooter(e.target.value)} />
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------- Главный компонент Приложения ---------- */
function App() {
  const [cfg, setCfg] = useState(loadConfig);
  const [role, setRole] = useState(loadRole);
  const [activePageId, setActivePageId] = useState(() => cfg.pages[0]?.id || 'home');
  const [saveStatus, setSaveStatus] = useState('Сохранено');
  const [quotaUsed, setQuotaUsed] = useState(0);

  const admin = role === 'admin';

  // Сохранение конфигурации
  useEffect(() => {
    window.siteTheme.apply(cfg);
    try {
      const json = JSON.stringify(cfg);
      localStorage.setItem(KEY, json);
      setQuotaUsed(Math.round((json.length / QUOTA_CHARS) * 100));
      setSaveStatus('Сохранено ' + nowTime());
    } catch (e) {
      setSaveStatus('Ошибка сохранения');
    }
  }, [cfg]);

  // Загрузка/Сохранение Роли
  const switchRole = (r) => {
    setRole(r);
    try { localStorage.setItem(ROLE_KEY, r); } catch (e) {}
  };

  const upload = async (file, opts) => {
    try {
      return await fileToDataUrl(file, opts);
    } catch (e) {
      alert('Ошибка при загрузке изображения');
      return null;
    }
  };

  const act = {
    add: (pageId, type) => setCfg((c) => ({ ...c, pages: c.pages.map((p) => (p.id === pageId ? { ...p, blocks: [...p.blocks, newBlock(type)] } : p)) })),
    patch: (pageId, blockId, f) => setCfg((c) => ({
      ...c,
      pages: c.pages.map((p) => (p.id === pageId ? { ...p, blocks: p.blocks.map((b) => (b.id === blockId ? (typeof f === 'function' ? f(b) : { ...b, ...f }) : b)) } : p))
    })),
    remove: (pageId, blockId) => setCfg((c) => ({ ...c, pages: c.pages.map((p) => (p.id === pageId ? { ...p, blocks: p.blocks.filter((b) => b.id !== blockId) } : p)) })),
    move: (pageId, blockId, dir) => setCfg((c) => ({ ...c, pages: c.pages.map((p) => (p.id === pageId ? { ...p, blocks: moved(p.blocks, blockId, dir) } : p)) })),
    dup: (pageId, blockId) => setCfg((c) => ({
      ...c,
      pages: c.pages.map((p) => {
        if (p.id !== pageId) return p;
        const i = p.blocks.findIndex((b) => b.id === blockId);
        if (i < 0) return p;
        const nb = reid(clone(p.blocks[i]));
        const b = [...p.blocks]; b.splice(i + 1, 0, nb);
        return { ...p, blocks: b };
      })
    })),
    addPage: () => {
      const np = { id: uid(), title: 'Новая страница', nav: true, accent: null, blocks: [newBlock('hero')] };
      setCfg((c) => ({ ...c, pages: [...c.pages, np] }));
      setActivePageId(np.id);
    },
    patchPage: (id, f) => setCfg((c) => ({ ...c, pages: c.pages.map((p) => (p.id === id ? { ...p, ...f } : p)) })),
    removePage: (id) => setCfg((c) => {
      if (c.pages.length <= 1) return c;
      const np = c.pages.filter((p) => p.id !== id);
      if (activePageId === id) setActivePageId(np[0].id);
      return { ...c, pages: np };
    }),
    movePage: (id, dir) => setCfg((c) => ({ ...c, pages: moved(c.pages, id, dir) })),
    setTheme: (theme) => setCfg((c) => ({ ...c, theme })),
    setPrimary: (primary) => setCfg((c) => ({ ...c, primary })),
    setFont: (font) => setCfg((c) => ({ ...c, font })),
    setRadius: (radius) => setCfg((c) => ({ ...c, radius })),
    setBrand: (brand) => setCfg((c) => ({ ...c, brand })),
    setContact: (contact) => setCfg((c) => ({ ...c, contact })),
    setFooter: (footer) => setCfg((c) => ({ ...c, footer })),
  };

  const activePage = cfg.pages.find((p) => p.id === activePageId) || cfg.pages[0];

  return (
    <Ctx.Provider value={{ admin, go: setActivePageId, pages: cfg.pages, upload, act, saveStatus, quotaUsed }}>
      <div className="min-h-screen flex flex-col">
        {/* Переключатель ролей */}
        <div className="rolebar px-4 py-2 flex items-center justify-between">
          <div className="seg">
            <button type="button" aria-pressed={role === 'admin'} onClick={() => switchRole('admin')}>Редактирование</button>
            <button type="button" aria-pressed={role === 'viewer'} onClick={() => switchRole('viewer')}>Просмотр</button>
          </div>
        </div>

        <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-6 flex flex-col">
          {admin && <AdminPanel cfg={cfg} act={act} activePageId={activePageId} setPageId={setActivePageId} />}

          {/* Шапка сайта */}
          <header className="flex flex-wrap items-center justify-between gap-4 py-4 border-b border-[var(--line)] mb-6">
            <div className="brand cursor-pointer" onClick={() => setActivePageId(cfg.pages[0]?.id || 'home')}>
              {cfg.logo ? <img src={cfg.logo} alt={cfg.brand} className="logo" /> : <span className="mark" />}
              <span>{cfg.brand}</span>
            </div>
            <nav className="flex flex-wrap gap-4 items-center">
              {cfg.pages.filter((p) => p.nav).map((p) => (
                <button key={p.id} type="button" className="navlink" aria-current={p.id === activePage.id ? 'page' : undefined} onClick={() => setActivePageId(p.id)}>
                  {p.title}
                </button>
              ))}
            </nav>
          </header>

          {/* Содержимое страницы */}
          <div className="flex-1">
            <PageView page={activePage} />
          </div>

          {/* Подвал сайта */}
          <footer className="mt-16 py-8 border-t border-[var(--line)] flex flex-wrap items-center justify-between gap-4 text-sm text-[var(--muted)]">
            <div>{cfg.footer}</div>
            {cfg.contact && <div>E-mail: <a href={'mailto:' + cfg.contact} className="underline">{cfg.contact}</a></div>}
          </footer>
        </main>
      </div>
    </Ctx.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body></html>
