  <title>Мой Сайт</title>
  
  <!-- Подключение шрифтов Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

  <style>
    /* ==========================================================================
       1. ЦВЕТОВАЯ ПАЛИТРА И СТИЛИ СТРАНИЦЫ
       ========================================================================== */
    :root {
      --bg: #fafaf9;            /* Основной фон страницы */
      --surface: #ffffff;       /* Фон карточек и панелей */
      --fg: #16161a;            /* Цвет основного текста */
      --muted: #6a6a75;         /* Цвет второстепенного текста */
      --line: #e6e6ea;          /* Цвет границ и разделителей */
      --danger: #d92d20;        /* Акцентный красный */
      --primary: #8E0A10;       /* Главный бордовый цвет */
      --on-primary: #ffffff;    /* Цвет текста на акцентном фоне */
      --font-body: 'Onest', system-ui, -apple-system, sans-serif;
      --font-head: var(--font-body);
      --font-mono: 'JetBrains Mono', monospace;
      --radius: 14px;
    }
    
    :root, .scope {
      --primary-text: var(--primary);
      --primary-soft: color-mix(in srgb, var(--primary) 9%, var(--bg));
    }

    /* Настройки для тёмной темы (если потребуется) */
    :root[data-theme="dark"] {
      --bg: #0e0e11; 
      --surface: #17171b; 
      --fg: #f2f2f4; 
      --muted: #9b9ba7; 
      --line: #27272d; 
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--fg);
      font-family: var(--font-body); font-size: 16px; line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
